<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مساعد خدمة المواطن</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/chat.css') }}">
  <style>
    /* جوه الـ iframe الصفحة بتاخد المساحة كلها من غير ظل أو حدود */
    .chat-shell { max-width: none; height: 100%; box-shadow: none; }
  </style>
</head>
<body>

<div class="chat-shell"
     id="chatRoot"
     data-api-base=""
     {% if district %}data-district-id="{{ district.id }}"{% endif %}>

  <header class="chat-header">
    <div class="avatar">🏛️</div>
    <div class="titles">
      <div class="title">{{ district.name if district else org_name }}</div>
      <div class="subtitle">
        <span class="status-dot"></span>
        مساعد خدمة المواطن
      </div>
    </div>
    <button type="button" class="header-btn" id="chatReset" title="محادثة جديدة">↻</button>
    <button type="button" class="header-btn" id="widgetClose" title="إغلاق">✕</button>
  </header>

  <main class="chat-body" id="chatBody" aria-live="polite"></main>

  <div class="quick-replies" id="quickReplies"></div>

  <footer class="chat-footer">
    <form class="composer" id="chatForm">
      <textarea id="chatInput"
                rows="1"
                placeholder="اكتب رسالتك هنا..."
                aria-label="رسالتك"
                maxlength="1500"></textarea>
      <button type="submit" id="chatSend" title="إرسال" aria-label="إرسال">➤</button>
    </form>
    <p class="chat-disclaimer">مساعد آلي — البيانات استرشادية.</p>
  </footer>

</div>

<script src="{{ url_for('static', filename='js/chat.js') }}"></script>
<script>
  // زر الإغلاق بيبلّغ الصفحة الأم عشان تقفل الـ iframe
  document.getElementById("widgetClose").addEventListener("click", function () {
    parent.postMessage({ type: "alx-chat-close" }, "*");
  });
</script>
</body>
</html>
