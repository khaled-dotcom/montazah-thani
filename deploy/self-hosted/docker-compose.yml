# ---------------------------------------------------------------------------
# المساعد لوحده، على أي جهاز إنت مالكه — لابتوب في البيت أو VM في السحابة.
# الاتنين بيشتغلوا بنفس الملف ده بالظبط: Tailscale Funnel بيدّي عنوان عام
# بشهادة HTTPS حقيقية من غير IP ثابت ولا فتح بورت في الراوتر.
#
# لو شغّال على لابتوب: المساعد بيبقى متاح وقت ما الجهاز شغّال وصاحي بس.
# لما ينام، الشات على الموقع بيرجع يجاوب من فهرس الموقع نفسه — الموقع
# كله على Vercel فمبيقعش، اللي بيقف هو فتح الشكاوى وحجز المواعيد من الشات.
#
#   db      PostgreSQL 16 + pgvector — قاعدة districts_db بتاعة المساعد بس.
#           الموقع قاعدته على Neon، مالوش دعوة بالجهاز ده.
#   agent   Flask + LangGraph
#   tunnel  Tailscale Funnel — بيدّي HTTPS بشهادة حقيقية على اسم .ts.net
#           من غير ما تشتري دومين ولا تشغّل certbot.
#
# ولا خدمة بتفتح بورت على الجهاز. الدنيا كلها بتدخل من الـ Funnel، يعني
# الـ agent نفسه مش مكشوف على IP الجهاز حتى لو الـ firewall مفتوح — وده
# مهم بالذات على لابتوب بيتنقل بين شبكات مش إنت اللي مأمّنها.
#
#   cp .env.example .env      # املأ القيم
#   docker compose up -d --build
#   docker compose exec agent flask import-site-knowledge
# ---------------------------------------------------------------------------

name: montazah-thani-agent

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: montazah-agent-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-districts_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres}']
      interval: 5s
      timeout: 5s
      retries: 5
    networks: [internal]

  agent:
    # كود المساعد جوّه نفس الريبو. على جهاز تاني انقل مجلد agent/ جنب
    # الملف ده وخلّيها ./agent.
    build: ../../agent
    container_name: montazah-agent
    restart: always
    environment:
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set}
      GROQ_API_KEY: ${GROQ_API_KEY:?GROQ_API_KEY must be set}
      SQLALCHEMY_DATABASE_URI: >-
        postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-districts_db}
      # السر المشترك مع الموقع. هنا مش اختياري: الـ Funnel بيحط الخدمة على
      # الإنترنت المفتوح، و/api/chat بيفتح شكاوى بأسماء مواطنين.
      AGENT_TOKEN: ${AGENT_TOKEN:?AGENT_TOKEN must be set — the funnel is public}
      # هوب واحد: tailscaled قدام الـ agent على نفس الـ namespace.
      # اتأكد بعد أول تشغيل:  curl -H "Authorization: Bearer $AGENT_TOKEN" .../whoami
      TRUST_PROXY: ${TRUST_PROXY:-1}
      GROQ_MODEL: ${GROQ_MODEL:-}
      GROQ_MODEL_FALLBACKS: ${GROQ_MODEL_FALLBACKS:-}
      GROQ_TIMEOUT: ${GROQ_TIMEOUT:-20}
      GROQ_MAX_RETRIES: ${GROQ_MAX_RETRIES:-1}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-intfloat/multilingual-e5-large}
      EMBEDDING_CACHE_DIR: /app/.embedding_cache
      ORG_NAME: ${ORG_NAME:-حي المنتزه الثانية — محافظة الإسكندرية}
      ORG_SHORT: ${ORG_SHORT:-خدمة المواطن}
      # الاسم بالإنجليزي، بيظهر في الردود اللي بتطلع بلغة رسالة المواطن.
      ORG_NAME_EN: ${ORG_NAME_EN:-El Montazah II District, Alexandria}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://montazah-thani.vercel.app}
      CHAT_RATE_LIMIT: ${CHAT_RATE_LIMIT:-12}
      SECURE_COOKIES: ${SECURE_COOKIES:-1}
    volumes:
      # الموديل ~2.2GB. في volume عشان ينزل مرة واحدة ويعيش عبر إعادة البناء —
      # على عكس Spaces، هنا فيه قرص باقي فعلًا.
      - embeddings:/app/.embedding_cache
      # البطاقات بتفضل موجودة بعد إعادة التشغيل، برضه على عكس Spaces.
      - tickets:/app/static/uploads
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]

  tunnel:
    image: tailscale/tailscale:latest
    container_name: montazah-agent-tunnel
    restart: always
    # نفس الـ network namespace بتاع الـ agent، فـ serve.json يقدر يوجّه
    # على 127.0.0.1:4500 من غير ما الـ agent يفتح بورت لبرة.
    network_mode: 'service:agent'
    environment:
      TS_USERSPACE: '1'
      TS_STATE_DIR: /state
      TS_HOSTNAME: ${TS_HOSTNAME:-montazah-agent}
      TS_SERVE_CONFIG: /serve.json
      # بيتقري أول مرة بس، وبعدين الهوية محفوظة في الـ volume.
      TS_AUTHKEY: ${TS_AUTHKEY:-}
    volumes:
      - tailscale-state:/state
      - ./serve.json:/serve.json:ro
    depends_on:
      - agent

networks:
  internal:
    driver: bridge

volumes:
  pgdata:
  embeddings:
  tickets:
  tailscale-state:
