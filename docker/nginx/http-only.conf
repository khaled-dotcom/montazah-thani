# ---------------------------------------------------------------------------
# حي المنتزه الثانية — nginx, plain HTTP.
#
# This is the BOOTSTRAP configuration. Use it to bring the stack up on a LAN or
# a fresh VM, and to let certbot answer its first challenge. Then switch to
# https.conf and never serve the public site from this one.
#
# Why it must not be the final state: the staff dashboard at /admin
# authenticates with HTTP Basic, which sends the password base64-encoded on
# every single request. Over plain http that is the same as publishing it.
# Anyone on the path — the office wifi, the building switch, the ISP — reads it
# once and has the district's booking record, with residents' names and
# telephone numbers in it.
#
#   .env:  NGINX_CONF=http-only.conf     ← you are here
#          NGINX_CONF=https.conf         ← after certbot
# ---------------------------------------------------------------------------

# Next.js streams server-rendered HTML over a kept-alive upstream connection.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Trust X-Forwarded-For only from the private ranges a sibling container can
# come from — a tunnel daemon, or a load balancer on the internal network.
# `real_ip_header` on its own does nothing: without set_real_ip_from there is no
# trusted source, so nginx ignores the header entirely.
#
# A request arriving straight off the internet is deliberately NOT covered. Its
# X-Forwarded-For is whatever the sender typed, and honouring that would let one
# client defeat the assistant's per-IP rate limit by inventing a new address on
# every request.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

upstream site {
    server web:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # nginx's version number tells an attacker which CVEs to try first.
    server_tokens off;

    # The forms post a few kilobytes. Nothing here accepts an upload, so a
    # large body is either a mistake or someone probing.
    client_max_body_size 2m;
    client_body_timeout 15s;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/javascript
        application/javascript application/json application/xml
        application/rss+xml image/svg+xml font/woff font/woff2;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # certbot writes its proof of domain control here; the volume is shared
    # with the certbot container. Must be reachable over plain http — that is
    # the whole point of the challenge — so it stays above any redirect.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://site;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        # Next.js streams the page shell before the data has arrived. Buffering
        # holds the whole response back and throws that away — the visitor
        # stares at nothing until the slowest part of the page is ready.
        proxy_buffering off;

        # The assistant is allowed 60s for one turn (lib/agent.ts). Time out
        # below that and nginx returns 504 while the answer is still coming.
        proxy_connect_timeout 10s;
        proxy_send_timeout    90s;
        proxy_read_timeout    90s;
    }
}
