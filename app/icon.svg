<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="حي المنتزه الثانية">
  <title>حي المنتزه الثانية — محافظة الإسكندرية</title>
  <!-- The Pharos lighthouse and its beams, taken from the governorate emblem on
       the district flag (public/images/logo.png) and reduced to what survives at
       16px — the founding figure beside it does not, so it is left out rather
       than rendered as a smudge. Colours are the flag's own and are fixed rather
       than themed: a favicon is drawn by the browser chrome, which knows nothing
       about the page's light or dark mode. -->
  <defs>
    <clipPath id="disc"><circle cx="24" cy="24" r="23" /></clipPath>
  </defs>

  <circle cx="24" cy="24" r="23" fill="#7e9bbe" />

  <g clip-path="url(#disc)" fill="#ffffff">
    <!-- beams -->
    <path d="M15.4 18.6 6.6 16.2l8.8-2.4zM32.6 18.6l8.8-2.4-8.8-2.4zM17.2 12.4 11 6.9l7.6 3.2zM30.8 12.4 37 6.9l-7.6 3.2z" />
    <!-- flame -->
    <path d="M24 3.5c2.4 2.6 3.3 4.7 2.6 6.4h-5.2c-.7-1.7.2-3.8 2.6-6.4z" />
    <!-- lantern, shaft, base -->
    <path d="M21.4 11.2h5.2l.7 4.2h-6.6zM20.2 17.1h7.6l1.1 7.4h-9.8zM18.5 26.2h11l1.6 10.4H16.9z" />
    <path d="M15.6 38.3h16.8l2 5.4H13.6z" />
  </g>

  <!-- door and lantern glass, punched back to the field colour -->
  <path d="M22.8 31.4h2.4v5.2h-2.4z" fill="#7e9bbe" />
  <path d="M22.9 19.1h2.2v3.4h-2.2z" fill="#7e9bbe" />
</svg>
