<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="مساعد خدمة المواطن لأحياء محافظة الإسكندرية — بلاغات، استعلامات، وحجز مواعيد.">
  <title>{{ district.name if district else org_name }} — خدمة المواطن</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/chat.css') }}">
</head>
<body>

<div class="chat-shell is-page"
     id="chatRoot"
     data-api-base=""
     {% if district %}data-district-id="{{ district.id }}"{% endif %}>

  <header class="chat-header">
    <div class="avatar">🏛️</div>
    <div class="titles">
      <div class="title">{{ district.name if district else org_name }}</div>
      <div class="subtitle">
        <span class="status-dot"></span>
        مساعد خدمة المواطن
      </div>
    </div>
    <button type="button" class="header-btn" id="chatReset" title="محادثة جديدة">↻</button>
  </header>

  {% if not district and districts %}
  <div class="district-bar">
    <label for="districtSelect">الحي:</label>
    <select id="districtSelect">
      <option value="">— اختر الحي (اختياري) —</option>
      {% for d in districts %}
        <option value="{{ d.id }}">{{ d.name }}</option>
      {% endfor %}
    </select>
  </div>
  {% endif %}

  <main class="chat-body" id="chatBody" aria-live="polite"></main>

  <div class="quick-replies" id="quickReplies"></div>

  <footer class="chat-footer">
    <form class="composer" id="chatForm">
      <textarea id="chatInput"
                rows="1"
                placeholder="اكتب رسالتك هنا..."
                aria-label="رسالتك"
                maxlength="1500"></textarea>
      <button type="submit" id="chatSend" title="إرسال" aria-label="إرسال">➤</button>
    </form>
    <p class="chat-disclaimer">
      مساعد آلي — البيانات المعروضة استرشادية ويعتمدها الحي المختص.
    </p>
  </footer>

</div>

<script src="{{ url_for('static', filename='js/chat.js') }}"></script>
</body>
</html>
