{% extends "base.html" %}

{% block title %}إضافة مستخدم — {{ org_name }}{% endblock %}
{% block topbar_title %}إضافة مستخدم{% endblock %}

{% block content %}
<div class="card">
  <form method="POST" style="padding:24px;max-width:520px">
    <div class="form-group">
      <label class="form-label" for="username">اسم المستخدم *</label>
      <input type="text" id="username" name="username" class="form-control" required>
    </div>

    <div class="form-group">
      <label class="form-label" for="password">كلمة المرور *</label>
      <input type="password" id="password" name="password" class="form-control" required>
    </div>

    <div class="form-group">
      <label class="form-label" for="district_id">نطاق الصلاحية</label>
      <select id="district_id" name="district_id" class="form-control">
        <option value="">مدير عام — كل الأحياء</option>
        {% for d in districts %}
          <option value="{{ d.id }}">{{ d.name }}</option>
        {% endfor %}
      </select>
    </div>

    <div style="display:flex;gap:10px;margin-top:24px">
      <button type="submit" class="btn btn-primary">
        <i data-lucide="save"></i> حفظ
      </button>
      <a href="{{ url_for('users') }}" class="btn btn-ghost">إلغاء</a>
    </div>
  </form>
</div>
{% endblock %}
