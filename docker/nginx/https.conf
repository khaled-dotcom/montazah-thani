# ---------------------------------------------------------------------------
# حي المنتزه الثانية — nginx, TLS. This is the production configuration.
#
# Requires a certificate at the paths below. Get one first with the bootstrap
# config (http-only.conf) and the certbot service in docker-compose.yml, then
# set NGINX_CONF=https.conf in .env and `docker compose up -d nginx`.
#
# Replace montazah2.alexandria.gov.eg with the real domain in the three places
# it appears — server_name here, and the two certificate paths.
# ---------------------------------------------------------------------------

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Trust X-Forwarded-For only from the private ranges a sibling container can
# come from. `real_ip_header` alone does nothing — without set_real_ip_from
# there is no trusted source and nginx ignores the header. A request arriving
# straight off the internet is deliberately not covered: honouring its
# self-declared address would let one client defeat the per-IP rate limit.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

upstream site {
    server web:3000;
    keepalive 32;
}

# --- plain http: the challenge, and a push to https -------------------------
server {
    listen 80;
    listen [::]:80;
    server_name montazah2.alexandria.gov.eg;
    server_tokens off;

    # Renewals need this to stay reachable over http, so it sits above the
    # redirect. Everything else goes to https.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- the site ---------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name montazah2.alexandria.gov.eg;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/montazah2.alexandria.gov.eg/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/montazah2.alexandria.gov.eg/privkey.pem;

    # TLS 1.2 and 1.3 only. 1.0 and 1.1 are withdrawn and would be the weakest
    # thing about this deployment.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP stapling: proves the certificate is not revoked without the visitor's
    # browser having to ask the CA, which is slower and tells the CA who is
    # reading a government site.
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 127.0.0.11 valid=60s;
    resolver_timeout 5s;

    client_max_body_size 2m;
    client_body_timeout 15s;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/javascript
        application/javascript application/json application/xml
        application/rss+xml image/svg+xml font/woff font/woff2;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # Every other security header — CSP, Referrer-Policy, Permissions-Policy —
    # is set by the app in next.config.mjs, where it lives next to the code that
    # justifies each one. Setting them here too would mean two sources of truth
    # that drift. HSTS is the exception: it is a statement about the transport,
    # nginx is what terminates the transport, and it must still be sent on a
    # response the app never produced (a 502 while web is restarting).
    #
    # Two years, with preload. Read this before turning preload on: it is a
    # commitment that this domain and every subdomain will serve https for that
    # long, and it is effectively irreversible in shipped browsers.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://site;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # The app builds absolute URLs and decides cookie security from this.
        # Send $scheme, not a hardcoded https, or a request that arrived on 80
        # is described as having arrived on 443.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        # Next.js streams the page shell before the data has arrived. Buffering
        # holds the whole response back and throws that away.
        proxy_buffering off;

        # The assistant is allowed 60s for one turn (lib/agent.ts).
        proxy_connect_timeout 10s;
        proxy_send_timeout    90s;
        proxy_read_timeout    90s;
    }

    # Fingerprinted build assets: the filename changes whenever the contents do,
    # so they can be held forever. The app sends this too; nginx repeating it
    # means a cache in front of nginx sees it even on a response nginx served
    # from its own buffer.
    location /_next/static/ {
        proxy_pass http://site;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
}
